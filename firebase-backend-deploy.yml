name: Deploy Firestore Rules & Cloud Functions

# Runs on every push to main. This workflow does the one-time folder
# staging Firebase's tooling requires for Cloud Functions (see README,
# section "A note on functions-index.js and functions-package.json")
# automatically in the CI runner only — it never modifies your actual
# repository files.
#
# COST NOTE: Firestore rules/indexes deploy is entirely free. Cloud
# Functions deployment and execution require your Firebase project to be
# on the "Blaze" (pay-as-you-go) plan — Google requires a billing method
# on file for Cloud Functions even though the free-of-charge monthly quota
# (2,000,000 invocations, 400,000 GB-seconds, 200,000 CPU-seconds, and 5GB
# outbound networking) comfortably covers a family app's access-key
# operations. See README section 11 for details.
on:
  push:
    branches: [main]
    paths:
      - "functions-index.js"
      - "functions-package.json"
      - "firestore.rules"
      - "firestore.indexes.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage Cloud Functions into the folder Firebase's CLI requires
        run: |
          mkdir -p functions
          cp functions-index.js functions/index.js
          cp functions-package.json functions/package.json

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules & indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
