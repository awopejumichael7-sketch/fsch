name: Deploy Firestore Rules & Indexes

# Runs on every push to main that touches the rules/indexes files. This is
# entirely free — Firestore rules & indexes deployment does not require
# the Blaze plan, only Hosting/Firestore/Auth on the free Spark plan.
#
# Cloud Functions are NOT deployed by this workflow. This app's default
# security model (see firestore.rules and README section 14) validates
# family setup and access-key redemption directly through Firestore
# Security Rules + client-side Firestore transactions, so no Cloud
# Functions — and no Blaze/billing account — are required at all. If you
# later choose to upgrade to Blaze for the optional server-side hardening
# in functions-index.js, use the separate, manually-triggered
# "firebase-functions-deploy-optional.yml" workflow.
on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules & indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
