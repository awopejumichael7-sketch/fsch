<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- PWA installability (added; nothing above/below this block was changed) -->
<meta name="theme-color" content="#101A2C" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Family Hub" />
<title>Sign In · Family Productivity Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="responsive.css" />
</head>
<body class="auth-body">

  <div class="auth-shell auth-shell--single">
    <div class="auth-shell__panel">
      <div class="brand-mark brand-mark--sm">FPH</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="subtitle subtitle--center">Sign in to Family Productivity Hub</p>

      <form id="login-form" class="auth-form" novalidate>
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <button type="submit" class="btn btn--primary btn--block">Sign In</button>
      </form>

      <button id="google-signin-btn" class="btn btn--outline btn--block">Continue with Google</button>

      <p class="auth-switch">
        <a href="#" id="forgot-password-link">Forgot password?</a>
      </p>
      <p class="auth-switch">New here? <a href="index.html">Create or join a family</a></p>
    </div>
  </div>

  <script type="module">
    import { bindAuthForms } from "./auth.js";
    bindAuthForms();
  </script>
  <script defer src="pwa-register.js"></script>
</body>
</html>
